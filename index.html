<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    --page-bg: #dfe6f0;
    --chip-bg: rgba(255, 255, 255, 0.74);
    --chip-text: #1b1d2e;
    --chip-border: rgba(27, 29, 46, 0.12);
    --btn-bg: #1b1d2e;
    --btn-text: #ffffff;
    --focus: #3d6bff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page-bg: #0e1024;
      --chip-bg: rgba(16, 18, 36, 0.7);
      --chip-text: #eef0ff;
      --chip-border: rgba(238, 240, 255, 0.14);
      --btn-bg: #eef0ff;
      --btn-text: #141629;
      --focus: #9fb4ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #0e1024;
    --chip-bg: rgba(16, 18, 36, 0.7);
    --chip-text: #eef0ff;
    --chip-border: rgba(238, 240, 255, 0.14);
    --btn-bg: #eef0ff;
    --btn-text: #141629;
    --focus: #9fb4ff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    overflow: hidden;
    touch-action: none;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }
  .chip {
    pointer-events: auto;
    background: var(--chip-bg);
    color: var(--chip-text);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--chip-border);
    border-radius: 20px;
    padding: 12px 16px;
    max-width: min(100%, 26rem);
  }
  .facing {
    margin: 0;
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    margin: 4px 0 0;
    font-size: 0.875rem;
    line-height: 1.4;
    opacity: 0.82;
  }
  button {
    pointer-events: auto;
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A landscape that changes with the direction you face and how you tilt your phone"></canvas>

<div class="panel">
  <div class="chip">
    <p class="facing" id="facing">Facing north, 0°</p>
    <p class="hint" id="hint" aria-live="polite">Drag to look around. Turn with the arrow keys or by scrolling.</p>
  </div>
  <button id="enable" type="button" hidden>Use motion sensor</button>
</div>

<script>
(() => {
  const cvs = document.getElementById("scene");
  const ctx = cvs.getContext("2d");
  const facingEl = document.getElementById("facing");
  const hintEl = document.getElementById("hint");
  const enableBtn = document.getElementById("enable");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
  const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = rng(20261105);

  // ---------- the sky for each compass direction ----------
  // North = night, east = dawn, south = midday, west = dusk.
  const K = [
    { top: "#0c1233", bot: "#2b3170", far: "#262c5e", near: "#070a1f", sunC: "#ffe2b0", sun: 0, moon: 1,   stars: 1,    lift: 0.30 },
    { top: "#3d4a8f", bot: "#f6b38e", far: "#b5738c", near: "#2b1d3d", sunC: "#ffd9a0", sun: 1, moon: 0,   stars: 0.12, lift: 0.05 },
    { top: "#2f7fd6", bot: "#c4e6f6", far: "#86b6cc", near: "#1f4a4f", sunC: "#fff6d8", sun: 1, moon: 0,   stars: 0,    lift: 0.34 },
    { top: "#2b1f5c", bot: "#ff8a5b", far: "#9e5070", near: "#241333", sunC: "#ffb36b", sun: 1, moon: 0.1, stars: 0.3,  lift: 0.07 },
  ].map(k => ({ ...k, top: hex(k.top), bot: hex(k.bot), far: hex(k.far), near: hex(k.near), sunC: hex(k.sunC) }));

  function sample(h) {
    const seg = (((h % 360) + 360) % 360) / 90;
    const i = Math.floor(seg) % 4, j = (i + 1) % 4, t = smooth(seg - Math.floor(seg));
    const a = K[i], b = K[j], o = {};
    for (const key in a) o[key] = Array.isArray(a[key]) ? mix(a[key], b[key], t) : lerp(a[key], b[key], t);
    return o;
  }

  // ---------- ridges (periodic, so a full turn wraps seamlessly) ----------
  const FREQS = [2, 3, 5, 8, 13, 21];
  const layers = Array.from({ length: 5 }, (_, i) => {
    const waves = FREQS.map((f, k) => ({
      f: f + Math.floor(rand() * 3),
      a: (0.6 + rand() * 0.8) / (k + 1.4),
      p: rand() * Math.PI * 2,
    }));
    const total = waves.reduce((s, w) => s + w.a, 0);
    return {
      waves, total,
      circ: 1.4 + i * 0.9,     // wider circumference = moves faster when turning
      base: 0.015 + i * 0.085, // how far below the horizon the layer sits
      amp: 0.05 + i * 0.032,
      depth: i * 0.09,         // extra vertical parallax with tilt
    };
  });
  function ridge(L, u) {
    let s = 0;
    for (const w of L.waves) s += w.a * Math.sin(Math.PI * 2 * w.f * u + w.p);
    return s / L.total;
  }

  const stars = Array.from({ length: 170 }, () => ({
    u: rand(), v: Math.pow(rand(), 1.5), r: 0.4 + rand() * 1.2, tw: rand() * Math.PI * 2,
  }));

  // ---------- input state ----------
  const target = { h: 90, p: 70, r: 0 };
  const cur = { h: 90, p: 70, r: 0 };
  let gotSensor = false, askedForSensor = false;

  function onOrient(e) {
    if (e.beta == null) return;
    if (!gotSensor) {
      gotSensor = true;
      enableBtn.hidden = true;
      hintEl.textContent = "Turn around to change the time of day. Tilt to move the hills.";
    }
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let heading = typeof e.webkitCompassHeading === "number"
      ? e.webkitCompassHeading
      : (e.alpha != null ? 360 - e.alpha : target.h);
    let p = e.beta, r = e.gamma;
    if (ang === 90) { p = -e.gamma; r = e.beta; }
    else if (ang === 270 || ang === -90) { p = e.gamma; r = -e.beta; }
    target.h = (((heading + ang) % 360) + 360) % 360;
    target.p = clamp(p, -10, 170);
    target.r = clamp(r || 0, -60, 60);
  }

  function listen() {
    const name = "ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation";
    addEventListener(name, onOrient);
    if (name !== "deviceorientation") addEventListener("deviceorientation", e => {
      if (typeof e.webkitCompassHeading === "number") onOrient(e);
    });
    setTimeout(() => {
      if (!gotSensor && askedForSensor) {
        hintEl.textContent = "No motion data reached this page. Drag to look around instead.";
      }
    }, 1800);
  }

  const needsPermission = typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function";
  const coarse = matchMedia("(pointer: coarse)").matches;

  if ("DeviceOrientationEvent" in window) {
    if (needsPermission) {
      enableBtn.hidden = false; // iOS needs a tap first
    } else {
      listen(); // Android and others: just start listening
      if (coarse) setTimeout(() => {
        if (!gotSensor) { enableBtn.hidden = false; }
      }, 1200);
    }
  }

  enableBtn.addEventListener("click", async () => {
    askedForSensor = true;
    if (!needsPermission) { listen(); return; }
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === "granted") listen();
      else hintEl.textContent = "Motion access was blocked. If no prompt appeared, this viewer doesn’t allow it. Open the page on its own site in Safari, or drag to look around.";
    } catch {
      hintEl.textContent = "This page can’t ask for motion access here. Drag to look around instead.";
    }
  });

  // Fallback controls: drag, hover, scroll, arrow keys
  let drag = null;
  cvs.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY };
    cvs.setPointerCapture(e.pointerId);
  });
  cvs.addEventListener("pointermove", e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag = { x: e.clientX, y: e.clientY };
      target.h = (target.h - dx * 0.25 + 360) % 360;
      target.p = clamp(target.p + dy * 0.2, 10, 130);
    } else if (e.pointerType === "mouse" && !gotSensor) {
      target.r = (e.clientX / W - 0.5) * 18;
    }
  });
  const endDrag = () => { drag = null; };
  cvs.addEventListener("pointerup", endDrag);
  cvs.addEventListener("pointercancel", endDrag);
  addEventListener("wheel", e => {
    target.h = (target.h + e.deltaY * 0.08 + 360) % 360;
  }, { passive: true });
  addEventListener("keydown", e => {
    const step = { ArrowLeft: [-8, 0], ArrowRight: [8, 0], ArrowUp: [0, 5], ArrowDown: [0, -5] }[e.key];
    if (!step) return;
    e.preventDefault();
    target.h = (target.h + step[0] + 360) % 360;
    target.p = clamp(target.p + step[1], 10, 130);
  });

  // ---------- render loop ----------
  const NAMES = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
  let lastLabel = "", last = performance.now();

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    // Low-pass filter so sensor jitter doesn't shake the scene
    const k = 1 - Math.exp(-dt * 7);
    const dh = ((target.h - cur.h + 540) % 360) - 180;
    cur.h = (cur.h + dh * k + 360) % 360;
    cur.p = lerp(cur.p, target.p, k);
    cur.r = lerp(cur.r, target.r, k);

    const s = sample(cur.h);
    // Roll gets unreliable as the phone approaches upright, so fade it out there
    const rollWeight = clamp(1 - Math.max(0, cur.p - 80) / 30, 0, 1);
    const roll = clamp(cur.r * 0.6 * rollWeight, -35, 35) * Math.PI / 180;

    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-roll);
    ctx.translate(-W / 2, -H / 2);

    const ext = Math.hypot(W, H) / 2 + 24;
    const left = W / 2 - ext, right = W / 2 + ext, top = H / 2 - ext, bottom = H / 2 + ext;
    const pitch = (cur.p - 70) / 60;
    const horizon = H * 0.58 + pitch * H * 0.35;

    // Sky
    const sky = ctx.createLinearGradient(0, Math.min(top, horizon - H), 0, horizon);
    sky.addColorStop(0, rgba(s.top));
    sky.addColorStop(1, rgba(s.bot));
    ctx.fillStyle = sky;
    ctx.fillRect(left, top, right - left, bottom - top);

    // Stars
    if (s.stars > 0.01) {
      const span = right - left;
      for (const st of stars) {
        const u = (((st.u - cur.h / 360) % 1) + 1) % 1;
        const x = left + u * span;
        const y = horizon - (0.08 + st.v * 0.95) * (horizon - top);
        const tw = reduceMotion.matches ? 0.8 : 0.55 + 0.45 * Math.sin(now * 0.0018 + st.tw);
        ctx.fillStyle = `rgba(255,255,255,${(s.stars * tw * (0.35 + st.v * 0.65)).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(x, y, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Sun and moon
    const R = Math.min(W, H) * 0.07;
    const bx = W / 2 + Math.sin(cur.h * Math.PI / 90) * W * 0.12;
    const by = horizon - s.lift * H - R * 0.4;
    if (s.sun > 0.01) {
      const glow = ctx.createRadialGradient(bx, by, R * 0.2, bx, by, R * 4.5);
      glow.addColorStop(0, rgba(s.sunC, 0.55 * s.sun));
      glow.addColorStop(1, rgba(s.sunC, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(bx - R * 5, by - R * 5, R * 10, R * 10);
      ctx.fillStyle = rgba(s.sunC, s.sun);
      ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.fill();
    }
    if (s.moon > 0.01) {
      ctx.fillStyle = `rgba(240,240,255,${s.moon})`;
      ctx.beginPath(); ctx.arc(bx, by, R * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(mix(s.top, s.bot, 0.55), s.moon);
      ctx.beginPath(); ctx.arc(bx + R * 0.38, by - R * 0.22, R * 0.72, 0, Math.PI * 2); ctx.fill();
    }

    // Haze sitting on the horizon
    const haze = ctx.createLinearGradient(0, horizon - H * 0.14, 0, horizon + H * 0.04);
    haze.addColorStop(0, rgba(s.bot, 0));
    haze.addColorStop(1, rgba(s.bot, 0.75));
    ctx.fillStyle = haze;
    ctx.fillRect(left, horizon - H * 0.14, right - left, H * 0.18);

    // Ridges, far to near
    layers.forEach((L, i) => {
      const t = i / (layers.length - 1);
      ctx.fillStyle = rgba(mix(s.far, s.near, Math.pow(t, 0.8)));
      const circ = L.circ * Math.max(W, 600);
      const pan = (cur.h / 360) * circ;
      const y0 = horizon + L.base * H + pitch * H * L.depth;
      const amp = L.amp * H;
      ctx.beginPath();
      ctx.moveTo(left, bottom);
      for (let x = left; x <= right + 6; x += 6) {
        const u = (x + pan) / circ;
        ctx.lineTo(x, y0 - amp * (0.5 + 0.5 * ridge(L, u)));
      }
      ctx.lineTo(right + 6, bottom);
      ctx.closePath();
      ctx.fill();
    });

    ctx.restore();

    const deg = Math.round(cur.h) % 360;
    const label = `Facing ${NAMES[Math.round(cur.h / 45) % 8]}, ${deg}°`;
    if (label !== lastLabel) { facingEl.textContent = label; lastLabel = label; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
